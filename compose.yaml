services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:5173:5173"
    environment:
      UNSPLASH_API_KEY: "${UNSPLASH_API_KEY:-}"
    volumes:
      - ./public:/app/public

  diffusion:
    build:
      context: .
      dockerfile: Dockerfile.sd
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./stable-diffusion-webui/models:/app/models
      - ./stable-diffusion-webui/outputs:/app/outputs
      - model-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  model-cache: